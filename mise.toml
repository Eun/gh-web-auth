[tools]
go = "1.22.2"

[tasks.build]
description = "Build the gh-web-auth binary"
run = "go build -o gh-web-auth ."

[tasks.run]
description = "Build and run gh-web-auth"
depends = ["build"]
run = "./gh-web-auth"

[tasks.install]
description = "Install binary and systemd service"
depends = ["build"]
run = """
cp gh-web-auth /usr/local/bin/gh-web-auth
cp gh-web-auth.service /etc/systemd/system/gh-web-auth.service
systemctl daemon-reload
systemctl enable gh-web-auth
systemctl start gh-web-auth
"""

[tasks.uninstall]
description = "Stop and remove systemd service and binary"
run = """
systemctl stop gh-web-auth || true
systemctl disable gh-web-auth || true
rm -f /etc/systemd/system/gh-web-auth.service
rm -f /usr/local/bin/gh-web-auth
systemctl daemon-reload
"""

[tasks.clean]
description = "Remove build artifacts"
run = "rm -f gh-web-auth"
